# Hostinger VPS overlay: Postgres runs on the same box instead of a managed
# database. Layered on top of the main file, never used on its own:
#
#     docker compose -f deploy/docker-compose.prod.yml -f deploy/docker-compose.hostinger.yml up -d
#
# deploy.sh adds this file automatically when backend/.env.db exists, which is
# only true on the Hostinger box.
#
# The data lives in the `pgdata` volume. `docker compose down` is safe;
# `docker compose down -v` DELETES THE DATABASE. Daily dumps are taken by
# deploy/backup-db.sh (cron), so a mistake costs at most a day.

services:
  db:
    image: postgres:16
    restart: unless-stopped
    logging:
      driver: json-file
      options:
        max-size: "10m"
        max-file: "3"
    # POSTGRES_USER / POSTGRES_PASSWORD / POSTGRES_DB. The api's DATABASE_URL in
    # .env.production must use the same values with host `db`.
    env_file:
      - ../backend/.env.db
    volumes:
      - pgdata:/var/lib/postgresql/data
    # No `ports:` — reachable only by the api over the compose network, never
    # from the internet.
    shm_size: 256mb
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    depends_on:
      db:
        condition: service_healthy

volumes:
  pgdata:
