# Security response headers, in one file because nginx makes them easy to lose.
#
# THE RULE THAT CAUSES THE BUG: `add_header` is inherited from the enclosing
# block ONLY IF the current block declares no `add_header` of its own. One
# `add_header Cache-Control ...` inside a location silently discards every
# security header set at the server level.
#
# That is exactly what happened here. `location = /index.html` set a
# Cache-Control header, and `/` reaches it through `try_files`, so the HTML
# document — the only response a browser applies these to — was served with none
# of them, while the API responses two lines away had all three. An external
# scan reported "Header not set" for headers that were plainly in the config.
#
# So every location that sets ANY header includes this file. Repetition is the
# only mechanism nginx offers; a file makes it repetition of one line.

# Always use HTTPS, including on the very first request, for a year.
# `preload` is deliberately absent: it is a submission to a list baked into
# browsers, and getting off that list takes months. Add it only deliberately.
add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

# Do not guess a file's type from its bytes. Type sniffing is how an uploaded
# file that claims to be an image gets executed as a script.
add_header X-Content-Type-Options "nosniff" always;

# Send the origin but not the path to other sites, and nothing at all when
# downgrading to http. A visa portal's URLs name applications and documents.
add_header Referrer-Policy "strict-origin-when-cross-origin" always;

# Clickjacking. frame-ancestors in the CSP below is the modern control and the
# one browsers honour; X-Frame-Options stays for the scanners and the handful of
# old clients that only read it.
add_header X-Frame-Options "DENY" always;

# Browser features this site never uses. Denying them means a compromised script
# cannot turn one on either.
add_header Permissions-Policy "camera=(), microphone=(), geolocation=(), payment=(), usb=(), interest-cohort=()" always;

# Content Security Policy.
#
#   script-src 'self'   — the bundle only. The two inline blocks in index.html
#                         are application/ld+json, which browsers parse as data
#                         and never execute, so no hash is needed for them.
#   style-src  'unsafe-inline' — required, and the honest reason is that the app
#                         uses 277 inline `style={{…}}` props. Removing it means
#                         removing those first. Far lower risk than inline
#                         script: a style cannot call fetch.
#   img-src    flagcdn  — country flags; cdn.<domain> — R2, where every logo,
#                         banner and thumbnail lives; data: — inline SVG icons.
#   connect-src 'self'  — the API is same-origin on purpose (the refresh cookie
#                         is sameSite=strict), so nothing else is needed.
#   frame-ancestors 'none' — this page is never legitimately embedded.
#   base-uri 'self'     — stops an injected <base> repointing every relative URL.
#   form-action 'self'  — stops an injected form posting credentials elsewhere.
add_header Content-Security-Policy "default-src 'self'; base-uri 'self'; object-src 'none'; frame-ancestors 'none'; form-action 'self'; script-src 'self'; style-src 'self' 'unsafe-inline'; img-src 'self' data: https://flagcdn.com https://cdn.nvimmigrationpvtltd.com; font-src 'self' data:; connect-src 'self' https://cdn.nvimmigrationpvtltd.com; frame-src 'none'; upgrade-insecure-requests" always;
