# nginx front door for the NV Immigration Portal.
#
# The SPA and the API are served from ONE origin. That is the whole point, not a
# tidiness preference: the refresh token is a sameSite=strict cookie, so if the
# browser sees the API as a different registrable domain it drops the cookie on
# every request and users log in then instantly log out. Same-origin removes the
# problem rather than working around it, which is the main reason this setup is
# nicer than a split PaaS deployment.

# "nginx/1.27.5" in every response tells an attacker exactly which CVE list to
# work from. `server_tokens off` reduces it to "nginx", which is as far as this
# directive goes — removing the header entirely needs a module nginx:alpine does
# not ship, and the version is the part that matters.
server_tokens off;

upstream api {
    # `api` is the service name in docker-compose.prod.yml.
    server api:4000;
    keepalive 32;
}

# Redirect everything to HTTPS. certbot rewrites this block when it issues the
# certificate; the ACME challenge path must stay reachable over plain HTTP.
server {
    listen 80;
    server_name nvimmigrationpvtltd.com www.nvimmigrationpvtltd.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name nvimmigrationpvtltd.com www.nvimmigrationpvtltd.com;

    ssl_certificate     /etc/letsencrypt/live/nvimmigrationpvtltd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nvimmigrationpvtltd.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;

    # Handshake cost, which is most of the time to first byte on a first visit.
    #
    # A 10m cache holds roughly 40,000 sessions but expires them after the
    # default 5 minutes, so a visitor who reads a page and clicks through pays
    # for a full handshake again. A day is the normal figure.
    ssl_session_cache   shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_session_tickets off;

    # OCSP stapling. Without it the BROWSER has to ask the CA whether this
    # certificate is still valid — a DNS lookup plus an HTTP request to a third
    # party, in the middle of the handshake, before a single byte of the page
    # arrives. Stapling attaches the CA's answer to the handshake instead.
    ssl_stapling on;
    ssl_stapling_verify on;
    ssl_trusted_certificate /etc/letsencrypt/live/nvimmigrationpvtltd.com/chain.pem;
    # Needed to resolve the CA's OCSP responder. Docker's embedded DNS, then a
    # public resolver, so stapling still works if the container's DNS changes.
    resolver 127.0.0.11 1.1.1.1 valid=300s;
    resolver_timeout 5s;

    root /usr/share/nginx/html;
    index index.html;

    # storage.js caps uploads at 25 MB (MAX_BYTES) and multer is set to match.
    # nginx defaults to 1 MB, which would reject every document upload with a
    # 413 before it ever reached the app — and the error would look like an app
    # bug, not a proxy setting.
    client_max_body_size 25m;

    # Security headers. helmet sets its own on API responses, but static assets
    # and index.html never pass through Express, so nginx owns them here.
    #
    # READ security-headers.conf BEFORE EDITING. `add_header` is inherited only
    # by blocks that declare no `add_header` of their own, so these three lines
    # sitting here alone were silently discarded for index.html — which is the
    # only response a browser applies them to. Every location that sets any
    # header includes the snippet for that reason.
    include /etc/nginx/security-headers.conf;

    gzip on;
    # text/html is always compressed and cannot be listed. The additions here are
    # the ones that were missing: the API's JSON goes out uncompressed on every
    # course search otherwise, and a 12-course page is ~40 kB of it.
    gzip_types text/css text/plain text/xml application/javascript application/json
               application/manifest+json image/svg+xml application/xml+rss;
    gzip_min_length 1024;
    # Compress what comes back from the API too, not just what nginx reads off
    # disk. Without this every proxied response skips gzip entirely.
    gzip_proxied any;
    gzip_vary on;

    # ── API ──────────────────────────────────────────────────────────────────
    location /api/ {
        # helmet already sets most of these on the response, but a duplicate
        # header is harmless and this keeps the guarantee uniform: no path on
        # this origin answers without them.
        include /etc/nginx/security-headers.conf;
        proxy_pass http://api;
        proxy_http_version 1.1;

        # X-Forwarded-For is load-bearing here. The app sets
        # `trust proxy = 1`, and express-rate-limit keys on req.ip — without
        # these headers every request arrives as nginx's own IP, so the
        # 20-per-15-minutes auth limit would be shared by ALL users at once and
        # one person's failed logins would lock out everybody.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # Local-disk uploads. Delete this block once S3/R2 is configured — files are
    # then served from the bucket's public URL and never touch this box.
    location /uploads/ {
        include /etc/nginx/security-headers.conf;
        proxy_pass http://api;
        proxy_set_header Host $host;
        # Keys are <folder>/<uuid>.<ext> and nothing overwrites one, so the bytes
        # behind a URL never change. Express sets the same header; this makes the
        # proxy agree rather than shorten it to a week.
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # ── SPA ──────────────────────────────────────────────────────────────────
    # Vite fingerprints filenames, so assets are safe to cache forever.
    location /assets/ {
        include /etc/nginx/security-headers.conf;
        expires 1y;
        add_header Cache-Control "public, max-age=31536000, immutable" always;
    }

    # index.html must never be cached, or a deploy leaves browsers loading the
    # old bundle references.
    # THE ONE THAT BROKE IT. `/` reaches this block through try_files, so this
    # is the response a browser scores — and a lone Cache-Control here threw
    # away every security header set at the server level above.
    location = /index.html {
        include /etc/nginx/security-headers.conf;
        add_header Cache-Control "no-cache" always;
    }

    # react-router owns every other path.
    location / {
        include /etc/nginx/security-headers.conf;
        try_files $uri $uri/ /index.html;
    }
}
