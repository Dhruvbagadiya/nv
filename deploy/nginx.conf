# nginx front door for the NV Immigration Portal.
#
# The SPA and the API are served from ONE origin. That is the whole point, not a
# tidiness preference: the refresh token is a sameSite=strict cookie, so if the
# browser sees the API as a different registrable domain it drops the cookie on
# every request and users log in then instantly log out. Same-origin removes the
# problem rather than working around it, which is the main reason this setup is
# nicer than a split PaaS deployment.

upstream api {
    # `api` is the service name in docker-compose.prod.yml.
    server api:4000;
    keepalive 32;
}

# Redirect everything to HTTPS. certbot rewrites this block when it issues the
# certificate; the ACME challenge path must stay reachable over plain HTTP.
server {
    listen 80;
    server_name nvimmigrationpvtltd.com www.nvimmigrationpvtltd.com;

    location /.well-known/acme-challenge/ {
        root /var/www/certbot;
    }

    location / {
        return 301 https://$host$request_uri;
    }
}

server {
    listen 443 ssl;
    http2 on;
    server_name nvimmigrationpvtltd.com www.nvimmigrationpvtltd.com;

    ssl_certificate     /etc/letsencrypt/live/nvimmigrationpvtltd.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/nvimmigrationpvtltd.com/privkey.pem;
    ssl_protocols       TLSv1.2 TLSv1.3;
    ssl_ciphers         HIGH:!aNULL:!MD5;
    ssl_session_cache   shared:SSL:10m;

    root /usr/share/nginx/html;
    index index.html;

    # storage.js caps uploads at 25 MB (MAX_BYTES) and multer is set to match.
    # nginx defaults to 1 MB, which would reject every document upload with a
    # 413 before it ever reached the app — and the error would look like an app
    # bug, not a proxy setting.
    client_max_body_size 25m;

    # HSTS is the one security header nginx must own; helmet sets the rest on API
    # responses, but static assets never pass through Express.
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;

    gzip on;
    gzip_types text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    # ── API ──────────────────────────────────────────────────────────────────
    location /api/ {
        proxy_pass http://api;
        proxy_http_version 1.1;

        # X-Forwarded-For is load-bearing here. The app sets
        # `trust proxy = 1`, and express-rate-limit keys on req.ip — without
        # these headers every request arrives as nginx's own IP, so the
        # 20-per-15-minutes auth limit would be shared by ALL users at once and
        # one person's failed logins would lock out everybody.
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header Connection        "";

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    # Local-disk uploads. Delete this block once S3/R2 is configured — files are
    # then served from the bucket's public URL and never touch this box.
    location /uploads/ {
        proxy_pass http://api;
        proxy_set_header Host $host;
        expires 7d;
    }

    # ── SPA ──────────────────────────────────────────────────────────────────
    # Vite fingerprints filenames, so assets are safe to cache forever.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }

    # index.html must never be cached, or a deploy leaves browsers loading the
    # old bundle references.
    location = /index.html {
        add_header Cache-Control "no-cache";
    }

    # react-router owns every other path.
    location / {
        try_files $uri $uri/ /index.html;
    }
}
